name: Verify VALP Examples

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Smoke test examples (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        python:
          - "3.9"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install verification dependencies
        run: python -m pip install jsonschema

      - name: Verify examples and audit gates
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/verify-examples.sh

  section20:
    name: Section 20 non-HERDR E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Run the real non-HERDR release E2E
        run: examples/langgraph-false-done/reproduce.sh

  smoke:
    name: Required smoke tests
    needs:
      - verify
      - section20
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless verification and Section 20 E2E succeed
        if: ${{ needs.verify.result != 'success' || needs.section20.result != 'success' }}
        run: exit 1

      - name: Confirm required verification success
        run: echo "All verify matrix jobs and the Section 20 E2E passed."
